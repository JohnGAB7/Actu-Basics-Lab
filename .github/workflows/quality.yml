name: Site quality

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate pages, links, catalogue and calculations
        run: python scripts/validate_site.py
      - name: Validate knowledge graph and catalogue references
        run: python scripts/validate_knowledge_graph.py
